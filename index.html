<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Thu Tiền Điện Lạnh</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] max-w-[500px] mx-auto min-h-screen">
<div class="bg-[#3b82f6] text-white p-4 font-bold text-center sticky top-0">SỔ THU TIỀN - ĐIỆN LẠNH LY</div>

<div class="bg-white m-3 p-4 rounded-xl shadow border">
<h3 class="font-bold text-blue-700 mb-3">+ NHẬP KHOẢN THU MỚI</h3>
<select id="staff" class="w-full border rounded-lg p-2.5 mb-3"><option value="">-- Chọn thợ --</option><option>Tấn</option><option>Trung</option><option>Trường</option><option>Mạnh</option><option>Đại</option></select>
<input id="address" placeholder="Địa chỉ khách" class="w-full border rounded-lg p-2.5 mb-3">
<input id="job" placeholder="Công việc: Sửa máy lạnh..." class="w-full border rounded-lg p-2.5 mb-3">
<div class="grid grid-cols-2 gap-3 mb-3">
<input id="amount" type="number" placeholder="Số tiền" class="border rounded-lg p-2.5">
<select id="status" class="border rounded-lg p-2.5"><option>Đã thu</option><option>Chưa hoàn về</option><option>Khách nợ</option></select>
</div>
<input id="date" type="date" class="w-full border rounded-lg p-2.5 mb-3">
<div class="flex gap-3">
<button onclick="staff.value='';address.value='';job.value='';amount.value=''" class="flex-1 border-2 border-blue-500 text-blue-500 rounded-full py-2">Hủy</button>
<button onclick="saveData()" class="flex-1 bg-blue-600 text-white rounded-full py-2 font-bold">Lưu thu tiền</button>
</div>
</div>

<div class="p-3">
<div id="tong" class="bg-indigo-100 p-3 rounded-xl text-center font-bold text-blue-800 mb-3"></div>
<div id="list"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('dl')||'[]');
document.getElementById('date').valueAsDate=new Date();
function saveData(){
 let s=staff.value, a=amount.value;
 if(!s||!a){alert('Chọn thợ và nhập tiền chị ơi!');return;}
 data.unshift({id:Date.now(),staff:s,address:address.value,job:job.value,amount:parseInt(a),status:status.value,date:date.value,time:new Date().toLocaleTimeString()});
 localStorage.setItem('dl',JSON.stringify(data)); render(); address.value='';job.value='';amount.value='';
}
function render(){
 let total=data.reduce((t,x)=>t+x.amount,0);
 document.getElementById('tong').innerHTML=data.length+' việc - Tổng: '+total.toLocaleString()+'đ';
 document.getElementById('list').innerHTML=data.map(d=>`
 <div class="bg-white p-3 rounded-xl border mb-2 flex justify-between">
 <div><b>${d.staff}</b> - ${d.job}<br><small class="text-gray-500">${d.address} - ${d.status} - ${d.date}</small></div>
 <div class="text-right"><b>${d.amount.toLocaleString()}đ</b><br><button onclick="data=data.filter(x=>x.id!==${d.id});localStorage.setItem('dl',JSON.stringify(data));render()" class="text-red-500 text-sm">Xóa</button></div>
